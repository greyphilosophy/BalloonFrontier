name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  discover-tests:
    runs-on: ubuntu-latest
    outputs:
      discord: ${{ steps.files.outputs.discord }}
      remainder: ${{ steps.files.outputs.remainder }}
    steps:
      - uses: actions/checkout@v4
      - id: files
        shell: bash
        run: |
          discord=$(find tests -maxdepth 1 -name 'test_discord*.py' ! -name 'test_discord_game_entry.py' -print | sort | jq -R -s -c 'split("\n")[:-1]')
          remainder=$(find tests -maxdepth 1 -name 'test_*.py' \
            ! -name 'test_discord*.py' ! -name 'test_cli*.py' \
            ! -name 'test_session_controller.py' ! -name 'test_session_adapters.py' \
            ! -name 'test_tutorial.py' -print | sort | jq -R -s -c 'split("\n")[:-1]')
          echo "discord=$discord" >> "$GITHUB_OUTPUT"
          echo "remainder=$remainder" >> "$GITHUB_OUTPUT"

  legacy-discord:
    needs: discover-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.discover-tests.outputs.discord) }}
    name: legacy-discord (${{ matrix.file }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest "${{ matrix.file }}" -q

  legacy-remainder:
    needs: discover-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.discover-tests.outputs.remainder) }}
    name: legacy-remainder (${{ matrix.file }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest "${{ matrix.file }}" -q

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - name: Test new session layers
        run: |
          python -m pytest tests/test_session_controller.py -q
          python -m pytest tests/test_session_adapters.py -q
          python -m pytest tests/test_discord_game_entry.py -q
      - name: Test tutorial
        run: python -m pytest tests/test_tutorial.py -q
      - name: Test legacy CLI suite
        run: python -m pytest tests/test_cli*.py -q
