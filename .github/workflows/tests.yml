name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Test session controller
        run: python -m pytest tests/test_session_controller.py -q

      - name: Test session adapters
        run: python -m pytest tests/test_session_adapters.py -q

      - name: Test Discord game entry
        run: python -m pytest tests/test_discord_game_entry.py -q

      - name: Run remaining tests
        run: python -m pytest tests/ -q --ignore=tests/test_session_controller.py --ignore=tests/test_session_adapters.py --ignore=tests/test_discord_game_entry.py
