name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  discover-discord-tests:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.files.outputs.files }}
    steps:
      - uses: actions/checkout@v4
      - id: files
        shell: bash
        run: |
          files=$(find tests -maxdepth 1 -name 'test_discord*.py' ! -name 'test_discord_game_entry.py' -print | sort | jq -R -s -c 'split("\n")[:-1]')
          echo "files=$files" >> "$GITHUB_OUTPUT"

  discover-nondiscord-tests:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.files.outputs.files }}
    steps:
      - uses: actions/checkout@v4
      - id: files
        shell: bash
        run: |
          files=$(find tests -maxdepth 1 -name 'test_*.py' ! -name 'test_discord*.py' ! -name 'test_cli*.py' ! -name 'test_session_controller.py' ! -name 'test_session_adapters.py' ! -name 'test_atmosphere_provider.py' ! -name 'test_atmosphere_profile.py' ! -name 'test_recorded_atmosphere_replay.py' -print | sort | jq -R -s -c 'split("\n")[:-1]')
          echo "files=$files" >> "$GITHUB_OUTPUT"

  legacy-discord:
    needs: discover-discord-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.discover-discord-tests.outputs.files) }}
    name: legacy-discord (${{ matrix.file }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - run: python -m pytest "${{ matrix.file }}" -q

  legacy-nondiscord:
    needs: discover-nondiscord-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.discover-nondiscord-tests.outputs.files) }}
    name: legacy-nondiscord (${{ matrix.file }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - run: python -m pytest "${{ matrix.file }}" -q

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Test new session layers
        run: |
          python -m pytest tests/test_session_controller.py -q
          python -m pytest tests/test_session_adapters.py -q
          python -m pytest tests/test_discord_game_entry.py -q
      - name: Test legacy CLI suite
        run: python -m pytest tests/test_cli*.py -q
      - name: Test atmosphere provider
        run: python -m pytest tests/test_atmosphere_provider.py -q
      - name: Test atmosphere profiles
        run: python -m pytest tests/test_atmosphere_profile.py -q
      - name: Test recorded atmosphere replay
        run: python -m pytest tests/test_recorded_atmosphere_replay.py -q
